services:
  cassandra:
    image: cassandra:4.1
    container_name: cryptoflow-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: cryptoflow
      CASSANDRA_DC: datacenter1
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  spark:
    image: apache/spark:3.4.4-scala2.12-java11-python3-ubuntu
    container_name: cryptoflow-spark
    user: root
    ports:
      - "4040:4040"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - CASSANDRA_HOSTS=cassandra
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  cassandra_data: